[package]
name = "llm_wiki_scripts"
version = "0.2.0"
edition = "2021"
description = "Unified Cargo workspace for LLM-Wiki × Sirchmunk executable generators, analyzers, and verifiers."

[lib]
name = "llm_wiki_scripts"
path = "src/lib.rs"

[profile.dev]
opt-level = 1
debug = 0
strip = "symbols"
incremental = true

[profile.test]
opt-level = 1
debug = 0

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
rustfft = "6.2"

# Binaries below are auto-registered by wiki_finalize.py from wiki/**/scripts/**/*.rs (DO NOT EDIT BY HAND).
# === WIKI-MANAGED-BINS:START ===
# === WIKI-MANAGED-BINS:END ===
